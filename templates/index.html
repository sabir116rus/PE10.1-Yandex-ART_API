<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генератор логотипов</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Кастомные стили -->
    <style>
        :root {
            --color-primary: #FF7F00;
            --color-secondary: #04819E;
        }

        .btn-primary {
            background-color: var(--color-primary) !important;
            border-color: var(--color-primary) !important;
        }

        .btn-primary:hover {
            background-color: #e46f00 !important;
            border-color: #e46f00 !important;
        }

        .text-primary {
            color: var(--color-primary) !important;
        }

        .text-secondary {
            color: var(--color-secondary) !important;
        }

        .spinner-container {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        img.logo-preview {
            max-width: 400px;
            height: auto;
        }
    </style>
</head>
<body class="container mt-5">

    <h1 class="mb-4 text-primary fw-bold">Генератор логотипов</h1>

    <form method="post" id="logo-form">
        <div class="mb-3">
            <label for="forma" class="form-label">Форма логотипа:</label>
            <input type="text" id="forma" name="forma" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="style" class="form-label">Стиль логотипа:</label>
            <input type="text" id="style" name="style" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Описание логотипа:</label>
            <input type="text" id="description" name="description" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Сгенерировать логотип</button>
    </form>

    <!-- Иконка загрузки -->
    <div class="spinner-container" id="loading-spinner">
        <div class="spinner-border text-secondary" role="status">
            <span class="visually-hidden">Загрузка...</span>
        </div>
        <p class="mt-2 text-secondary">Подождите, логотип создается...</p>
    </div>

    {% if image %}
        <h2 class="mt-4 text-success">Результат:</h2>
        <img src="{{ image }}" alt="Логотип" class="logo-preview mt-2">
    {% elif error %}
        <h2 class="mt-4 text-danger">Произошла ошибка:</h2>
    {% endif %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Логика отображения спиннера -->
    <script>
        document.getElementById('logo-form').addEventListener('submit', function () {
            const spinner = document.getElementById('loading-spinner');
            spinner.style.display = 'block';

            setTimeout(() => {
                spinner.style.display = 'none';
            }, 20000); // можно убрать, если обрабатываешь на сервере
        });
    </script>

</body>
</html>
